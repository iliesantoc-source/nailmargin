
<!-- =====================================================
     NAILMARGIN — ELEGANT YOUTUBE MUSIC PLAYER
     Video: JRrFKtZjUSY
     Start: 07:38 (458 seconds)
     ===================================================== -->

<style>
  .nailmargin-music {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
    font-family: 'Manrope', Arial, sans-serif;
  }

  .nailmargin-music-title {
    color: #765543;
    font-size: 9px;
    font-weight: 800;
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }

  .nailmargin-music-button {
    width: 31px;
    height: 31px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid #e2d5c7;
    border-radius: 50%;
    background: #fffdfa;
    color: #765543;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.25s ease;
  }

  .nailmargin-music-button:hover {
    background: #d8b899;
    color: #30221d;
    transform: translateY(-2px);
  }

  .nailmargin-music-volume {
    width: 55px;
    height: 4px;
    cursor: pointer;
    accent-color: #b58b67;
  }

  .nailmargin-music-status {
    font-size: 9px;
    color: #87766a;
    white-space: nowrap;
  }

  .nailmargin-music-video {
    position: fixed;
    top: 90px;
    right: 15px;
    z-index: 9999;
    padding: 9px;
    border: 1px solid #e2d5c7;
    border-radius: 12px;
    background: #fffdfa;
    box-shadow: 0 15px 45px #30221d35;
  }

  .nailmargin-music-video[hidden] {
    display: none !important;
  }

  #nailmargin-youtube-player {
    width: 200px;
    height: 200px;
  }

  @media (max-width: 850px) {
    .nailmargin-music-title,
    .nailmargin-music-status {
      display: none;
    }

    .nailmargin-music {
      gap: 5px;
    }

    .nailmargin-music-button {
      width: 27px;
      height: 27px;
      font-size: 11px;
    }

    .nailmargin-music-volume {
      width: 38px;
    }
  }

  @media (max-width: 450px) {
    .nailmargin-music-volume {
      width: 30px;
    }
  }
</style>

<script>
(function () {
  "use strict";

  const VIDEO_ID = "JRrFKtZjUSY";
  const START_TIME = 458;
  const DEFAULT_VOLUME = 35;

  let player = null;
  let playerReady = false;
  let isPlaying = false;
  let isMuted = true;

  // Find the existing NailMargin navigation.
  const navigation = document.querySelector(
    ".header .nav, header .nav"
  );

  if (!navigation) {
    console.warn(
      "NailMargin Music: bara de navigare nu a fost găsită."
    );
    return;
  }

  // Create the discreet player controls.
  const musicBar = document.createElement("div");
  musicBar.className = "nailmargin-music";
  musicBar.setAttribute("aria-label", "Muzică NailMargin");

  musicBar.innerHTML = `
    <span class="nailmargin-music-title">MUSIC</span>

    <button
      type="button"
      class="nailmargin-music-button"
      id="nm-play"
      aria-label="Pornește muzica"
      title="Play / Pauză"
    >▶</button>

    <button
      type="button"
      class="nailmargin-music-button"
      id="nm-mute"
      aria-label="Activează sunetul"
      title="Sunet"
    >🔇</button>

    <input
      type="range"
      id="nm-volume"
      class="nailmargin-music-volume"
      min="0"
      max="100"
      value="35"
      aria-label="Volum"
    >

    <button
      type="button"
      class="nailmargin-music-button"
      id="nm-show-video"
      aria-label="Arată videoclipul"
      title="Arată / Ascunde videoclipul"
    >♫</button>
  `;

  navigation.appendChild(musicBar);

  // The YouTube player must remain available
  // in a compliant 200 x 200 video panel.
  const videoPanel = document.createElement("div");
  videoPanel.className = "nailmargin-music-video";
  videoPanel.id = "nm-video-panel";
  videoPanel.hidden = true;

  videoPanel.innerHTML = `
    <div id="nailmargin-youtube-player"></div>
  `;

  document.body.appendChild(videoPanel);

  const playButton = document.getElementById("nm-play");
  const muteButton = document.getElementById("nm-mute");
  const volumeInput = document.getElementById("nm-volume");
  const showVideoButton = document.getElementById("nm-show-video");

  function updateButtons() {
    playButton.textContent = isPlaying ? "Ⅱ" : "▶";

    playButton.setAttribute(
      "aria-label",
      isPlaying ? "Pauză" : "Pornește muzica"
    );

    muteButton.textContent = isMuted ? "🔇" : "🔊";

    muteButton.setAttribute(
      "aria-label",
      isMuted ? "Activează sunetul" : "Oprește sunetul"
    );
  }

  function onPlayerReady(event) {
    playerReady = true;

    event.target.setVolume(DEFAULT_VOLUME);
    event.target.mute();

    // Attempt muted autoplay from 07:38.
    event.target.seekTo(START_TIME, true);
    event.target.playVideo();

    updateButtons();
  }

  function onPlayerStateChange(event) {
    if (event.data === YT.PlayerState.PLAYING) {
      isPlaying = true;
    } else if (
      event.data === YT.PlayerState.PAUSED ||
      event.data === YT.PlayerState.ENDED
    ) {
      isPlaying = false;
    }

    // Repeat from 07:38 when the video ends.
    if (event.data === YT.PlayerState.ENDED) {
      player.seekTo(START_TIME, true);
      player.playVideo();
    }

    updateButtons();
  }

  window.onYouTubeIframeAPIReady = function () {
    player = new YT.Player("nailmargin-youtube-player", {
      width: "200",
      height: "200",
      videoId: VIDEO_ID,

      playerVars: {
        autoplay: 1,
        mute: 1,
        start: START_TIME,
        playsinline: 1,
        controls: 1,
        rel: 0
      },

      events: {
        onReady: onPlayerReady,
        onStateChange: onPlayerStateChange,
        onAutoplayBlocked: function () {
          isPlaying = false;
          updateButtons();
        },
        onError: function (event) {
          console.warn(
            "NailMargin Music: YouTube error",
            event.data
          );
        }
      }
    });
  };

  // Play / Pause
  playButton.addEventListener("click", function () {
    if (!playerReady) return;

    if (isPlaying) {
      player.pauseVideo();
    } else {
      player.playVideo();
    }
  });

  // Mute / Unmute
  muteButton.addEventListener("click", function () {
    if (!playerReady) return;

    if (isMuted) {
      player.unMute();
      player.setVolume(Number(volumeInput.value));
      isMuted = false;
    } else {
      player.mute();
      isMuted = true;
    }

    updateButtons();
  });

  // Volume
  volumeInput.addEventListener("input", function () {
    if (!playerReady) return;

    const newVolume = Number(volumeInput.value);

    player.setVolume(newVolume);

    if (newVolume === 0) {
      player.mute();
      isMuted = true;
    } else {
      player.unMute();
      isMuted = false;
    }

    updateButtons();
  });

  // Show / hide the YouTube video.
  showVideoButton.addEventListener("click", function () {
    videoPanel.hidden = !videoPanel.hidden;

    showVideoButton.setAttribute(
      "aria-label",
      videoPanel.hidden
        ? "Arată videoclipul"
        : "Ascunde videoclipul"
    );
  });

  // Load YouTube IFrame API.
  const youtubeScript = document.createElement("script");
  youtubeScript.src = "https://www.youtube.com/iframe_api";
  youtubeScript.async = true;

  document.head.appendChild(youtubeScript);

  updateButtons();
})();
</script>

<!-- END NAILMARGIN MUSIC PLAYER -->
